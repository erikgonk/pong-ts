<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* Using a custom font to better match the image */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #191A1A; /* Main background */
        }
        /* Custom colors for Tailwind config */
        .bg-custom-yellow { background-color: #EDD24E; }
        .bg-custom-black { background-color: #191A1A; }
        .text-custom-yellow { color: #EDD24E; }
        .text-custom-white { color: #D9D9D9; }
        .fill-custom-yellow { fill: #EDD24E; }
        .fill-custom-white { fill: #D9D9D9; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Main Dashboard Container -->
    <div class="bg-custom-yellow w-full max-w-sm mx-auto rounded-3xl shadow-lg p-4 space-y-6">
        
        <!-- Header -->
        <header class="text-center py-2">
            <h1 class="text-xl font-bold text-custom-black">Dashboard</h1>
        </header>

        <!-- User Section -->
        <div class="flex justify-between items-center px-2">
            <h2 id="username" class="text-2xl font-bold text-custom-black"></h2>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-custom-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 17l-5-5m0 0l5-5m-5 5h12" />
            </svg>
        </div>

        <!-- Stats Cards Grid -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Card: Total Won -->
            <div class="bg-custom-black rounded-2xl p-4 text-center">
                <div class="bg-gray-700 rounded-full w-10 h-10 mx-auto flex items-center justify-center mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-custom-yellow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <p id="total-won" class="text-3xl font-bold text-custom-white"></p>
                <p class="text-sm text-gray-400">Total Won</p>
            </div>
            <!-- Card: Total Lost -->
            <div class="bg-custom-black rounded-2xl p-4 text-center">
                <div class="bg-gray-700 rounded-full w-10 h-10 mx-auto flex items-center justify-center mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-custom-yellow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                    </svg>
                </div>
                <p id="total-lost" class="text-3xl font-bold text-custom-white"></p>
                <p class="text-sm text-gray-400">Total Lost</p>
            </div>
            <!-- Card: Total Scores -->
            <div class="bg-custom-black rounded-2xl p-4 text-center">
                 <div class="bg-gray-700 rounded-full w-10 h-10 mx-auto flex items-center justify-center mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-custom-yellow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <p id="total-scores" class="text-3xl font-bold text-custom-white"></p>
                <p class="text-sm text-gray-400">Total Scores</p>
            </div>
            <!-- Card: Total Friends -->
            <div class="bg-custom-black rounded-2xl p-4 text-center">
                <div class="bg-gray-700 rounded-full w-10 h-10 mx-auto flex items-center justify-center mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-custom-yellow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
                <p id="total-friends" class="text-3xl font-bold text-custom-white"></p>
                <p class="text-sm text-gray-400">Total Friends</p>
            </div>
        </div>

        <!-- Total Points Bar Chart -->
        <div class="bg-custom-black rounded-2xl p-4">
            <h3 class="text-xl font-bold text-custom-white mb-4">Total Points</h3>
            <div id="bar-chart"></div>
            <div class="flex justify-center items-center space-x-6 mt-4">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-custom-yellow"></div>
                    <span class="text-sm text-gray-400">Scored</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-custom-white"></div>
                    <span class="text-sm text-gray-400">Received</span>
                </div>
            </div>
        </div>

        <!-- Wons & Lost Donut Chart -->
        <div class="bg-custom-black rounded-2xl p-4">
            <h3 class="text-xl font-bold text-custom-white mb-4">Wons & Lost</h3>
            <div id="donut-chart" class="relative"></div>
             <div class="flex justify-center items-center space-x-6 mt-4">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-custom-yellow"></div>
                    <span id="won-percentage" class="text-sm text-gray-400"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-custom-white"></div>
                    <span id="lost-percentage" class="text-sm text-white-400"></span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">

        /**
         * Clears the previous chart and draws a new bar chart based on the provided data.
         * @param {Array<{label: string, value: number}>} barChartData - Data for the bar chart.
         */
        const createBarChart = (barChartData) => {
            // Clear previous SVG to prevent duplicates
            d3.select("#bar-chart").html("");

            const margin = { top: 20, right: 20, bottom: 20, left: 40 };
            const width = 300 - margin.left - margin.right;
            const height = 150 - margin.top - margin.bottom;

            const svg = d3.select("#bar-chart")
                .append("svg")
                .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const yScale = d3.scaleLinear()
                .domain([0, d3.max(barChartData, d => d.value) * 1.1]) // Dynamic domain + 10% padding
                .range([height, 0]);

            const xScale = d3.scaleBand()
                .domain(barChartData.map(d => d.label))
                .range([0, width])
                .padding(0.5);

            const yAxisGrid = d3.axisLeft(yScale)
                .tickSize(-width)
                .tickFormat(() => "")
                .ticks(3);

            svg.append("g")
                .attr("class", "y-axis-grid")
                .call(yAxisGrid)
                .selectAll("line")
                .attr("stroke", "#4A5568");
            
            svg.selectAll(".domain").remove();

            const yAxisLabels = d3.axisLeft(yScale).ticks(3);
            svg.append("g")
                .call(yAxisLabels)
                .attr("color", "#A0AEC0")
                .selectAll(".domain, .tick line").remove();

            svg.selectAll(".bar")
                .data(barChartData)
                .enter()
                .append("rect")
                .attr("class", "bar")
                .attr("x", d => xScale(d.label))
                .attr("y", d => yScale(d.value))
                .attr("width", xScale.bandwidth())
                .attr("height", d => height - yScale(d.value))
                .attr("fill", d => d.label === 'Scored' ? '#EDD24E' : '#D9D9D9')
                .attr("rx", 6)
                .attr("ry", 6);
        };

        /**
         * Clears the previous chart and draws a new donut chart based on the provided data.
         * @param {Array<{label: string, value: number}>} donutChartData - Data for the donut chart.
         */
        const createDonutChart = (donutChartData) => {
            // Clear previous SVG
            d3.select("#donut-chart").html("");

            const width = 200;
            const height = 200;
            const radius = Math.min(width, height) / 2;
            const donutWidth = 30;

            const color = d3.scaleOrdinal()
                .domain(donutChartData.map(d => d.label))
                .range(['#EDD24E', '#D9D9D9']);

            const svg = d3.select("#donut-chart")
                .append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .append("g")
                .attr("transform", `translate(${width / 2},${height / 2})`);

            const arc = d3.arc()
                .innerRadius(radius - donutWidth)
                .outerRadius(radius)
                .cornerRadius(10);

            const pie = d3.pie()
                .value(d => d.value)
                .sort(null);

            svg.selectAll('path')
                .data(pie(donutChartData))
                .enter()
                .append('path')
                .attr('d', arc)
                .attr('fill', d => color(d.data.label));
        };

        /**
         * Main function to update all dashboard elements from a data object.
         * @param {object} data - The complete dataset for the dashboard.
         */
        const updateDashboard = (data) => {
            // Update text elements
            document.getElementById('username').textContent = data.username;
            document.getElementById('total-won').textContent = data.stats.won;
            document.getElementById('total-lost').textContent = data.stats.lost;
            document.getElementById('total-scores').textContent = data.stats.scores;
            document.getElementById('total-friends').textContent = data.stats.friends;

            // Update chart data and redraw
            const barChartData = [
                { label: 'Received', value: data.points.received },
                { label: 'Scored', value: data.points.scored },
            ];
            createBarChart(barChartData);

            const totalGames = data.stats.won + data.stats.lost;
            const wonPercentage = totalGames > 0 ? Math.round((data.stats.won / totalGames) * 100) : 0;
            const lostPercentage = 100 - wonPercentage;

            const donutChartData = [
                { label: 'Won', value: wonPercentage },
                { label: 'Lost', value: lostPercentage },
            ];
            createDonutChart(donutChartData);

            // Update legend percentages
            document.getElementById('won-percentage').textContent = `Won ${wonPercentage}%`;
            document.getElementById('lost-percentage').textContent = `Lost ${lostPercentage}%`;
        };

        // --- Initial Data and Setup ---

        // Initial data for the dashboard
        let initialData = {
            username: 'erigonza',
            stats: {
                won: 7,
                lost: 3,
                scores: 42,
                friends: 3
            },
            points: {
                scored: 42,
                received: 25
            }
        };

        // Initial render of the dashboard
        updateDashboard(initialData);

    </script>
</body>
</html>
