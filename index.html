<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="src/script.ts" type="module"></script>
  <title>Pong TypeScript</title>
</head>
<body>
  <!-- Left sidebar - 10% -->
  <div class="sidebar-left">
    <div class="game-title">PONG</div>
  </div>

  <!-- Main container - 90% -->
  <div class="main-container">
    <!-- Top yellow border - 2% -->
    <div class="border-top"></div>

    <!-- Middle section - 96% -->
    <div class="middle-section">
      <!-- Game area with rounded corners -->
      <div class="game-area">
        <!-- Score area at top -->
        <div class="score">
          <div class="score-section">
            <div class="score-label">USER 1</div>
            <div class="score-value" id="left-score">0</div>
          </div>
          <div class="score-section">
            <div class="score-label">USER 2</div>
            <div class="score-value" id="right-score">0</div>
          </div>
        </div>

        <!-- Game elements -->
        <div class="ball" id="ball"></div>
        <div class="paddle left" id="left-paddle"></div>
        <div class="paddle right" id="right-paddle"></div>
      </div>
      <!-- Right yellow border (2vw margin-right in game-area) -->
    </div>

    <!-- Bottom yellow border - 2% -->
    <div class="border-bottom"></div>
  </div>
</body>
</html>
